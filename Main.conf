RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT,no-resolve

# Pure domain matching avoids DNS pre-resolution for domain requests.
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list,DIRECT

# Direct IP connections can still match; domain requests skip this lookup.
GEOIP,CN,DIRECT,no-resolve
FINAL,PROXY
